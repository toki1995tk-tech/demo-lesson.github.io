<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Алгоритмы ветвления</title>

    <!-- Подключаем Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #312e81,
                    #4f46e5,
                    #0891b2
                );

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;

        }


        .card {

            width: 100%;

            max-width: 500px;

            background: white;

            border-radius: 30px;

            padding: 40px 30px;

            text-align: center;

            box-shadow:
                0 25px 70px
                rgba(0,0,0,0.3);

        }


        .badge {

            display: inline-block;

            background: #eef2ff;

            color: #4f46e5;

            padding: 8px 15px;

            border-radius: 50px;

            font-size: 14px;

            font-weight: bold;

            margin-bottom: 20px;

        }


        h1 {

            margin: 0;

            font-size: 32px;

            color: #111827;

        }


        .question {

            margin-top: 20px;

            margin-bottom: 30px;

            font-size: 18px;

            line-height: 1.5;

            color: #6b7280;

        }


        input {

            width: 100%;

            padding: 17px;

            border-radius: 15px;

            border: 2px solid #e5e7eb;

            font-size: 18px;

            outline: none;

        }


        input:focus {

            border-color: #4f46e5;

        }


        button {

            width: 100%;

            margin-top: 15px;

            padding: 17px;

            border: none;

            border-radius: 15px;

            background: #4f46e5;

            color: white;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;

        }


        button:hover {

            background: #4338ca;

        }


        button:disabled {

            opacity: 0.6;

        }


        #message {

            margin-top: 20px;

            font-weight: bold;

            display: none;

        }

    </style>

</head>


<body>


<div class="card">

    <div class="badge">

        🧠 ВХОД В УРОК

    </div>


    <h1>

        Алгоритмы ветвления

    </h1>


    <div class="question">

        Напишите <b>одно слово</b>,

        которое у вас ассоциируется

        с этой темой.

    </div>


    <input
        id="wordInput"
        type="text"
        maxlength="40"
        placeholder="Ваше слово..."
    >


    <button id="sendButton">

        Отправить 🚀

    </button>


    <div id="message"></div>

</div>



<script>


/* =====================================
   1. ДАННЫЕ SUPABASE
   ===================================== */


const SUPABASE_URL ="https://wbvvhlrrutmjawrwzwhk.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_QJsp3Dn1V4bxHP1DmPLlLA_coWw9tDX";



/* =====================================
   2. СОЗДАЁМ ПОДКЛЮЧЕНИЕ
   ===================================== */


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );



/* =====================================
   3. НАХОДИМ ЭЛЕМЕНТЫ НА СТРАНИЦЕ
   ===================================== */


const input =
    document.getElementById("wordInput");


const button =
    document.getElementById("sendButton");


const message =
    document.getElementById("message");



/* =====================================
   4. ОТПРАВКА СЛОВА
   ===================================== */


async function sendWord() {


    const word =
        input.value.trim();


    // Если поле пустое

    if (!word) {

        showMessage(
            "Пожалуйста, напишите слово 🙂",
            "error"
        );

        return;

    }


    button.disabled = true;

    button.textContent =
        "Отправляем...";


    // Отправляем слово в таблицу words

    const { error } =
        await supabaseClient

            .from("words")

            .insert({

                word: word

            });


    // Если произошла ошибка

    if (error) {

        console.error(error);

        showMessage(
            "Что-то пошло не так 😔",
            "error"
        );

        button.disabled = false;

        button.textContent =
            "Отправить 🚀";

        return;

    }


    // Если всё хорошо

    input.value = "";

    showMessage(
        "✓ Ответ отправлен!",
        "success"
    );


    button.textContent =
        "Отправлено ✓";


    setTimeout(() => {

        button.disabled = false;

        button.textContent =
            "Отправить 🚀";

    }, 2000);

}



/* =====================================
   5. СООБЩЕНИЕ
   ===================================== */


function showMessage(text, type) {


    message.textContent = text;

    message.style.display = "block";


    if (type === "success") {

        message.style.color =
            "#059669";

    } else {

        message.style.color =
            "#dc2626";

    }

}



/* =====================================
   6. КНОПКА
   ===================================== */


button.addEventListener(
    "click",
    sendWord
);



/* Можно нажать Enter */

input.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            sendWord();

        }

    }
);


</script>


</body>

</html>
